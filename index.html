<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="캐릭터로 걸어 다니며 탐험하는 WebGL2 그래픽스 포트폴리오" />
    <title>그래픽스 플레이그라운드</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="game" tabindex="-1" aria-label="캐릭터를 조작하는 3D 공간"></canvas>

    <button id="pause-button" type="button" aria-label="일시 정지" hidden>
      <span></span><span></span>
    </button>

    <div id="joystick" aria-hidden="true" hidden>
      <div id="joystick-knob"></div>
    </div>

    <div id="screen">
      <div class="screen-card">
        <h1 id="screen-title">불러오는 중</h1>
        <p id="screen-message"></p>
        <dl id="screen-controls" hidden>
          <dt class="controls-pointer"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt>
          <dd class="controls-pointer">걷기</dd>
          <dt class="controls-pointer"><kbd>마우스</kbd></dt>
          <dd class="controls-pointer">시점 돌리기</dd>
          <dt class="controls-pointer"><kbd>Esc</kbd></dt>
          <dd class="controls-pointer">일시 정지</dd>
          <dt class="controls-touch"><kbd>왼쪽 드래그</kbd></dt>
          <dd class="controls-touch">걷기</dd>
          <dt class="controls-touch"><kbd>오른쪽 드래그</kbd></dt>
          <dd class="controls-touch">시점 돌리기</dd>
          <dt class="controls-touch"><kbd>Ⅱ</kbd></dt>
          <dd class="controls-touch">일시 정지</dd>
        </dl>
        <button id="screen-action" type="button" hidden></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
